[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-digital-icarus-backend"
version = "0.1.0"
description = "Explainable event contractor matching service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.30.6",
]

[project.optional-dependencies]
dev = [
    "httpx==0.27.2",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.setuptools.packages.find]
include = ["backend*"]
namespaces = true

[tool.setuptools.package-data]
"backend.app.matching" = ["*.json"]
