name: Integrated product checks

# GitHub cannot start jobs in the BAITC-Hacks organization: every run since
# 2026-09-23 fails in about 3 seconds with "The job was not started because
# your account is locked due to a billing issue." That is an organization
# billing lock, not a test failure. Automatic push/PR runs are disabled so the
# repository does not show false red checks. The same steps run locally; see
# "Automated checks" in README.md. Re-enable push/pull_request once the
# organization's Actions billing is restored.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matching-and-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e '.[dev]' --no-deps
      - run: python -m pytest -q
      - run: python scripts/matching_acceptance.py --repeat 20
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run test:client
      - run: npm run test:i18n
      - run: npm run test:numeric
      - run: npm --prefix frontend test
      - run: npm run typecheck:client
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:e2e
        env:
          RUN_APP_SERVERS: '1'
